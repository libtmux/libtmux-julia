name: docs-preview-cleanup

# The default-branch workflow reads only the numeric PR from the event. It
# checks out the cleanup script of the base branch and no pull request content,
# so nothing a pull request adds runs with the cleanup role.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: docs-deploy-${{ github.repository }}
  queue: max

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: docs-preview-cleanup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/docs-preview-cleanup
          persist-credentials: false

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
          arch: x64

      # Closed events can be rerun after a PR reopens. Read current state
      # before assuming the cleanup role or deleting any object.
      - id: current
        name: Check current cleanup eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          julia --startup-file=no
          scripts/docs-preview-cleanup/docs-preview-cleanup.jl
          eligibility
          --repository "$REPOSITORY"
          --pr "$PR"
          --github-output "$GITHUB_OUTPUT"

      - if: steps.current.outputs.should_cleanup == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LIBTMUX_DOCS_PREVIEW_CLEANUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Delete this Julia preview
        if: steps.current.outputs.should_cleanup == 'true'
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          julia --startup-file=no
          scripts/docs-preview-cleanup/docs-preview-cleanup.jl
          delete
          --bucket "$BUCKET"
          --pr "$PR"
