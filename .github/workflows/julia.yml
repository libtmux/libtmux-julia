name: Julia

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
      rejected: ${{ steps.rejected.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag metadata
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          github.event.deleted == false &&
          github.repository == 'libtmux/libtmux-julia'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_path }}
        run: >-
          python3 dev/check-release-tag.py verify
          --checkout "$GITHUB_WORKSPACE"
          --event "$RELEASE_EVENT"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_SHA"
          --ref "$RELEASE_REF"
          --repository "$RELEASE_REPOSITORY"
          --output "$RUNNER_TEMP/libtmux-julia-release-preflight.toml"
      - id: cells
        run: echo "cells=$(python3 dev/check-matrix.py matrix --split)" >> "$GITHUB_OUTPUT"
      - id: rejected
        run: echo "cells=$(python3 dev/check-matrix.py matrix --rejection)" >> "$GITHUB_OUTPUT"
      - name: Check matrix ownership and result states
        run: python3 dev/check-matrix.py self-test

  reject:
    needs: matrix
    name: ${{ matrix.job_label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rejected) }}
    timeout-minutes: 15
    env:
      TMPDIR: /tmp
      JULIA_TEST_VERBOSE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
          arch: x64
      - name: Prepare Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Prepare pinned tmux release
        run: python3 dev/check-matrix.py build-tmux "$RUNNER_TEMP/libtmux-julia-reject" '${{ matrix.tmux }}'
      - name: Prepare the current client
        run: python3 dev/check-matrix.py build-tmux "$RUNNER_TEMP/libtmux-julia-reject" 3.7c
      - name: Assert the release is refused without effect
        env:
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/${{ matrix.tmux }}/bin/tmux
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.7c/bin/tmux
          LIBTMUX_TEST_OLD_TMUX_BUILDS: ${{ matrix.real_old == 'true' && format('{0}/libtmux-julia-reject/tmux', runner.temp) || '' }}
          LIBTMUX_TEST_OLD_TMUX_RELEASES: ${{ matrix.real_old == 'true' && matrix.tmux || '' }}
        run: julia --startup-file=no --project=. --threads=1 test/runtests.jl ${{ matrix.suite }}
      - name: Prepare the package environment
        run: >-
          julia --startup-file=no -e 'using Pkg;
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "libtmux-julia-reject", "packages"));
          Pkg.add(["JSON", "Tables"]);
          Pkg.develop([PackageSpec(path="."),
          PackageSpec(path="packages/LibTmuxWorkspace"),
          PackageSpec(path="packages/LibTmuxMCP")]);
          Pkg.precompile()'
      - name: Assert the workspace CLI refuses the release
        env:
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/${{ matrix.tmux }}/bin/tmux
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.7c/bin/tmux
          LIBTMUX_TEST_REQUIRE_OLD_DAEMON: '1'
        run: julia --startup-file=no --project="$RUNNER_TEMP/libtmux-julia-reject/packages" --threads=1 packages/LibTmuxWorkspace/test/runtests.jl old-daemon
      - name: Assert the MCP server refuses a replaced daemon
        if: matrix.real_old == 'true'
        env:
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.7c/bin/tmux
          LIBTMUX_TEST_OLD_TMUX_BUILDS: ${{ runner.temp }}/libtmux-julia-reject/tmux
          LIBTMUX_TEST_OLD_TMUX_RELEASES: ${{ matrix.tmux }}
          LIBTMUX_TEST_REQUIRE_OLD_DAEMON: '1'
        run: julia --startup-file=no --project="$RUNNER_TEMP/libtmux-julia-reject/packages" --threads=1 packages/LibTmuxMCP/test/runtests.jl old-daemon

  check:
    needs: matrix
    name: ${{ matrix.job_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cells) }}
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
      JULIA_TEST_VERBOSE: 'true'
      JULIA_CPU_TARGET: generic
    steps:
      - name: Choose owned preparation stage
        run: |
          echo "MATRIX_STAGE=$RUNNER_TEMP/libtmux-julia-matrix" >> "$GITHUB_ENV"
          echo "MATRIX_JOB_DEADLINE=$(( $(date +%s) + 1200 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia }}
          arch: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
          show-versioninfo: true
      - name: Check setup argument conversion offline
        run: python3 dev/check-matrix.py self-test --julia julia
      - name: Prepare Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Prepare pinned tmux release
        run: python3 dev/check-matrix.py build-tmux "$MATRIX_STAGE" '${{ matrix.tmux }}'
      - name: Cache isolated Julia tool depot
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: libtmux-julia-matrix-depot-v1
          depot: ${{ runner.temp }}/libtmux-julia-matrix/depot
          delete-old-caches: "false"
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/libtmux-julia-matrix/depot
      - name: Prepare Julia tools and external consumers
        run: >-
          python3 dev/check-matrix.py prepare "$MATRIX_STAGE"
          --threads '${{ matrix.threads }}'
      - name: Check prepared cell offline
        run: >-
          python3 dev/check-matrix.py run "$MATRIX_STAGE"
          --tmux "$MATRIX_STAGE/tmux/${{ matrix.tmux }}/bin/tmux"
          --threads '${{ matrix.threads }}'
          --suite '${{ matrix.suite }}'
          --expected-julia '${{ matrix.julia }}'
          --expected-tmux '${{ matrix.tmux }}'
          --expected-os '${{ matrix.os }}'
          --expected-arch '${{ matrix.arch }}'
      - name: Preserve native documentation artifact
        if: matrix.os == 'Linux' && matrix.tmux == '3.7c' && matrix.threads == 1 && (matrix.suite == 'all' || matrix.suite == 'delivery')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: julia-docs-api
          path: docs/build/api.json
          if-no-files-found: error
          retention-days: 7
      - name: Finalize sanitized evidence
        if: always()
        timeout-minutes: 1
        run: python3 dev/check-matrix.py artifacts "$MATRIX_STAGE"
      - name: Preserve cell evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.job_label }}
          if-no-files-found: warn
          path: ${{ env.MATRIX_STAGE }}/artifacts/
          retention-days: 7

  tag-install:
    name: Verify public tag install
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted == false &&
      github.repository == 'libtmux/libtmux-julia'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_EVENT: ${{ github.event_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
          arch: x64
      - name: Choose fresh tag-install stage
        run: echo "RELEASE_STAGE=$RUNNER_TEMP/libtmux-julia-release" >> "$GITHUB_ENV"
      - name: Prepare release tag record
        run: |
          mkdir -p "$RELEASE_STAGE"
          python3 dev/check-release-tag.py verify \
            --checkout "$GITHUB_WORKSPACE" \
            --event "$RELEASE_EVENT" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --ref "$RELEASE_REF" \
            --repository "$RELEASE_REPOSITORY" \
            --output "$RELEASE_STAGE/release.toml"
      - name: Install public tag into a fresh Julia environment
        run: >-
          julia --startup-file=no --history-file=no
          dev/check-tag-install.jl verify
          --release "$RELEASE_STAGE/release.toml"
          --stage "$RELEASE_STAGE"
          --checkout "$GITHUB_WORKSPACE"
      - name: Recheck public tag after installation
        run: >-
          python3 dev/check-release-tag.py verify
          --checkout "$GITHUB_WORKSPACE"
          --event "$RELEASE_EVENT"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_SHA"
          --ref "$RELEASE_REF"
          --repository "$RELEASE_REPOSITORY"
          --output "$RELEASE_STAGE/release-after.toml"
      - name: Compare release records
        run: cmp -- "$RELEASE_STAGE/release.toml" "$RELEASE_STAGE/release-after.toml"
      - name: Preserve tag-install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-tag-install
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/libtmux-julia-release/release.toml
            ${{ runner.temp }}/libtmux-julia-release/release-after.toml
            ${{ runner.temp }}/libtmux-julia-release/install-proof.toml
            ${{ runner.temp }}/libtmux-julia-release/project/Project.toml
            ${{ runner.temp }}/libtmux-julia-release/project/Manifest.toml
