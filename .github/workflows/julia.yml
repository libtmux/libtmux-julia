name: Julia

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest tmux, full runs the whole table and
          the refusal lanes, custom runs the refs in tmux-ref. A v* tag runs
          the full scope.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6c,master.
        type: string
        default: ''
      julia:
        description: >-
          The Julia version for every cell, such as 1.12.4 or lts. Empty uses
          1.13.1.
        type: string
        default: ''
      threads:
        description: With scope custom, 1 or 4 threads. Empty uses 1.
        type: string
        default: ''
      suite:
        description: With scope custom, runtime, delivery or both. Empty uses runtime.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: julia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a run covers is decided here, from the table in dev/plan_matrix.py and
  # the event, so no job below lists a tmux version. A push and a pull request
  # test the oldest and newest release; a v* tag, and a dispatch that asks, test
  # the whole table. A bad input fails here, before any runner builds anything.
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      rejected: ${{ steps.plan.outputs.rejected }}
      run_rejected: ${{ steps.plan.outputs.run_rejected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Plan the run
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          JULIA_VERSION: ${{ inputs.julia }}
          THREADS: ${{ inputs.threads }}
          SUITE: ${{ inputs.suite }}
        run: >-
          python3 dev/plan_matrix.py plan
          --event "$EVENT"
          --ref "$REF"
          --scope "$SCOPE"
          --tmux-ref "$TMUX_REF"
          --julia "$JULIA_VERSION"
          --threads "$THREADS"
          --suite "$SUITE"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Prepare Python quality tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.0'
          enable-cache: false
      - name: Acquire Python quality dependencies
        run: |
          uvx ruff@0.16.1 --version
          uvx mypy@2.4.0 --version
      - name: Check Python helpers offline
        run: |
          uvx --offline ruff@0.16.1 check
          uvx --offline ruff@0.16.1 format --check
          uvx --offline mypy@2.4.0
          python3 dev/check-release-tag.py self-test
          python3 benchmark/startup.py --self-test
          python3 benchmark/mcp_client.py --self-test
      - name: Verify release tag metadata
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          github.event.deleted == false &&
          github.repository == 'libtmux/libtmux-julia'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_path }}
        run: >-
          python3 dev/check-release-tag.py verify
          --checkout "$GITHUB_WORKSPACE"
          --event "$RELEASE_EVENT"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_SHA"
          --ref "$RELEASE_REF"
          --repository "$RELEASE_REPOSITORY"
          --output "$RUNNER_TEMP/libtmux-julia-release-preflight.toml"
      - name: Check matrix ownership and result states
        run: python3 dev/check-matrix.py self-test
      - name: Check the matrix plan and its deliberate breaks
        run: python3 dev/plan_matrix.py self-test

  reject:
    needs: matrix
    if: needs.matrix.outputs.run_rejected == 'true'
    name: ${{ matrix.job_label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rejected) }}
    timeout-minutes: 15
    env:
      TMPDIR: /tmp
      JULIA_TEST_VERBOSE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
          arch: x64
      - name: Prepare Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Prepare pinned tmux release
        run: python3 dev/check-matrix.py build-tmux "$RUNNER_TEMP/libtmux-julia-reject" '${{ matrix.tmux }}'
      - name: Prepare the current client
        run: python3 dev/check-matrix.py build-tmux "$RUNNER_TEMP/libtmux-julia-reject" 3.3a
      - name: Assert the release is refused without effect
        env:
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/${{ matrix.tmux }}/bin/tmux
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.3a/bin/tmux
          LIBTMUX_TEST_OLD_TMUX_BUILDS: ${{ matrix.real_old == 'true' && format('{0}/libtmux-julia-reject/tmux', runner.temp) || '' }}
          LIBTMUX_TEST_OLD_TMUX_RELEASES: ${{ matrix.real_old == 'true' && matrix.tmux || '' }}
        run: julia --startup-file=no --project=. --threads=1 test/runtests.jl ${{ matrix.suite }}
      - name: Prepare the package environment
        run: >-
          julia --startup-file=no -e 'using Pkg;
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "libtmux-julia-reject", "packages"));
          Pkg.add(["JSON", "Tables"]);
          Pkg.develop([PackageSpec(path="."),
          PackageSpec(path="packages/LibTmuxWorkspace"),
          PackageSpec(path="packages/LibTmuxMCP")]);
          Pkg.precompile()'
      - name: Assert the workspace CLI refuses the release
        env:
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/${{ matrix.tmux }}/bin/tmux
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.3a/bin/tmux
          LIBTMUX_TEST_REQUIRE_OLD_DAEMON: '1'
        run: julia --startup-file=no --project="$RUNNER_TEMP/libtmux-julia-reject/packages" --threads=1 packages/LibTmuxWorkspace/test/runtests.jl old-daemon
      - name: Assert the MCP server refuses a replaced daemon
        if: matrix.real_old == 'true'
        env:
          LIBTMUX_TEST_CLIENT_TMUX: ${{ runner.temp }}/libtmux-julia-reject/tmux/3.3a/bin/tmux
          LIBTMUX_TEST_OLD_TMUX_BUILDS: ${{ runner.temp }}/libtmux-julia-reject/tmux
          LIBTMUX_TEST_OLD_TMUX_RELEASES: ${{ matrix.tmux }}
          LIBTMUX_TEST_REQUIRE_OLD_DAEMON: '1'
        run: julia --startup-file=no --project="$RUNNER_TEMP/libtmux-julia-reject/packages" --threads=1 packages/LibTmuxMCP/test/runtests.jl old-daemon

  check:
    needs: matrix
    name: ${{ matrix.job_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cells) }}
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
      JULIA_TEST_VERBOSE: 'true'
      JULIA_CPU_TARGET: generic
    steps:
      - name: Choose owned preparation stage
        run: |
          echo "MATRIX_STAGE=$RUNNER_TEMP/libtmux-julia-matrix" >> "$GITHUB_ENV"
          echo "MATRIX_JOB_DEADLINE=$(( $(date +%s) + 1200 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia }}
          arch: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
          show-versioninfo: true
      - name: Check setup argument conversion offline
        run: python3 dev/check-matrix.py self-test --julia julia
      - name: Prepare Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Prepare pinned tmux release
        if: matrix.kind == 'release'
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          python3 dev/check-matrix.py build-tmux "$MATRIX_STAGE" "$TMUX_VERSION"
          echo "TMUX_BINARY=$MATRIX_STAGE/tmux/$TMUX_VERSION/bin/tmux" >> "$GITHUB_ENV"
      # A tag, branch or commit outside the table is built from source at the
      # commit it names. The commit is resolved first, and the build is kept
      # under it, never under the name.
      - name: Resolve the tmux ref
        id: resolve
        if: matrix.kind == 'ref'
        env:
          TMUX_REF: ${{ matrix.tmux }}
        run: python3 dev/check-matrix.py resolve-tmux "$TMUX_REF" | tee -a "$GITHUB_OUTPUT"
      - name: Prepare tmux from the ref
        if: matrix.kind == 'ref'
        env:
          TMUX_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          python3 dev/check-matrix.py build-tmux-ref "$MATRIX_STAGE" "$TMUX_COMMIT"
          echo "TMUX_BINARY=$MATRIX_STAGE/tmux/ref-$TMUX_COMMIT/bin/tmux" >> "$GITHUB_ENV"
      - name: Cache isolated Julia tool depot
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: libtmux-julia-matrix-depot-${{ env.JULIA_CPU_TARGET }}-v2
          depot: ${{ runner.temp }}/libtmux-julia-matrix/depot
          delete-old-caches: "false"
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/libtmux-julia-matrix/depot
      - name: Prepare Julia tools and external consumers
        run: |
          set -o pipefail
          mkdir -p "$MATRIX_STAGE/logs"
          python3 dev/check-matrix.py prepare "$MATRIX_STAGE" \
            --threads '${{ matrix.threads }}' \
            2>&1 | tee "$MATRIX_STAGE/logs/preparation.log"
      - name: Check prepared cell offline
        env:
          THREADS: ${{ matrix.threads }}
          SUITE: ${{ matrix.suite }}
          EXPECTED_JULIA: ${{ matrix.expected_julia }}
          EXPECTED_TMUX: ${{ matrix.expected_tmux }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          python3 dev/check-matrix.py run "$MATRIX_STAGE"
          --tmux "$TMUX_BINARY"
          --threads "$THREADS"
          --suite "$SUITE"
          --expected-julia "$EXPECTED_JULIA"
          --expected-tmux "$EXPECTED_TMUX"
          --expected-os "$EXPECTED_OS"
          --expected-arch "$EXPECTED_ARCH"
      - name: Preserve native documentation artifact
        if: matrix.docs_artifact == 'true' && matrix.suite == 'delivery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: julia-docs-api
          path: docs/build/api.json
          if-no-files-found: error
          retention-days: 7
      - name: Finalize sanitized evidence
        if: always()
        timeout-minutes: 1
        run: python3 dev/check-matrix.py artifacts "$MATRIX_STAGE"
      - name: Preserve cell evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.job_label }}
          if-no-files-found: warn
          path: ${{ env.MATRIX_STAGE }}/artifacts/
          retention-days: 7

  # A lane the plan left out of scope must be skipped and a lane it planned
  # must succeed. Accepting a skip for a planned lane would let a failure that
  # skips its dependents pass.
  required:
    name: required
    needs: [matrix, reject, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev
      - name: Require every planned job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 dev/plan_matrix.py gate

  tag-install:
    name: Verify public tag install
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted == false &&
      github.repository == 'libtmux/libtmux-julia'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
          arch: x64
      - name: Choose fresh tag-install stage
        run: echo "RELEASE_STAGE=$RUNNER_TEMP/libtmux-julia-release" >> "$GITHUB_ENV"
      - name: Prepare release tag record
        env:
          RELEASE_EVENT: ${{ github.event_path }}
        run: |
          mkdir -p "$RELEASE_STAGE"
          python3 dev/check-release-tag.py verify \
            --checkout "$GITHUB_WORKSPACE" \
            --event "$RELEASE_EVENT" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --ref "$RELEASE_REF" \
            --repository "$RELEASE_REPOSITORY" \
            --output "$RELEASE_STAGE/release.toml"
      - name: Install public tag into a fresh Julia environment
        run: >-
          julia --startup-file=no --history-file=no
          dev/check-tag-install.jl verify
          --release "$RELEASE_STAGE/release.toml"
          --stage "$RELEASE_STAGE"
          --checkout "$GITHUB_WORKSPACE"
      - name: Recheck public tag after installation
        env:
          RELEASE_EVENT: ${{ github.event_path }}
        run: >-
          python3 dev/check-release-tag.py verify
          --checkout "$GITHUB_WORKSPACE"
          --event "$RELEASE_EVENT"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_SHA"
          --ref "$RELEASE_REF"
          --repository "$RELEASE_REPOSITORY"
          --output "$RELEASE_STAGE/release-after.toml"
      - name: Compare release records
        run: cmp -- "$RELEASE_STAGE/release.toml" "$RELEASE_STAGE/release-after.toml"
      - name: Preserve tag-install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-tag-install
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/libtmux-julia-release/release.toml
            ${{ runner.temp }}/libtmux-julia-release/release-after.toml
            ${{ runner.temp }}/libtmux-julia-release/install-proof.toml
            ${{ runner.temp }}/libtmux-julia-release/project/Project.toml
            ${{ runner.temp }}/libtmux-julia-release/project/Manifest.toml
