schema_version = 1
status = "implementation in progress"

[support]
julia_development = "1.13.0"
julia_proposed_floor = "1.10"
tmux_proposed_floor = "3.2a"
platforms_proposed = ["Linux x86_64", "macOS arm64", "macOS x86_64"]
verified_product_cells = []

[required]
packages = "partial: three external imports, optional extensions and installed applications have focused evidence; complete exported products pending"
server_selection = "implemented: explicit selectors and opt-in ambient discovery"
entities_links_identity = "partial: physical entities and links verified; strict identity admission pending"
snapshots_coverage = "partial: captured graph and explicit coverage verified; topology/restart adversaries pending"
formats = "partial: typed observations, explicit raw expressions and unverified hints tested current/floor"
options_environment_hooks = "partial: scoped values, inheritance and sparse hooks verified; full transport matrix pending"
topology_lifecycle = "partial: typed topology and owned daemon success/failure cleanup verified; full matrix pending"
capture_keys_paste_buffers = "partial: exact bytes, explicit keys, paste and owned buffers verified over subprocess and control current/floor; full platform matrix pending"
native_criteria = "partial: generated local criteria and real captured relations verified; matrix/DX pending"
wire_adapters = "partial: Julia/JSON plus pinned sibling scalar differentials pass; complete consumer/matrix proof pending"
subprocess = "partial: bytes, bounds, cancellation and process retirement verified in development cell"
control_batches = "partial: owned lanes, batches/groups, strict capture, graph acquisition, topology, clients, buffers and environment writes verified; typed configuration reads/options/hooks remain open"
observation_cursors = "partial: bounded streams and replay verified on current/floor; reset baseline available; full matrix pending"
mcp = "partial: modern/legacy installed clients, observation tools and cancellation verified; dynamic schemas and effect diagnostics corrected; complete normal matrix pending"
workspace = "partial: config/apply/freeze, owned rollback and installed CLI verified; stopped output-reader retirement and full matrix pending"
docs_examples = "partial: Documenter/doctest and real core examples pass; external discovery and human DX gate pending"
benchmarks = "partial: separate environment and six-mode workload added; measurements and full B1 pending"

[deferred]
pushdown = "Q3 admission and differentials required before shipping"
portable_regex = "cross-language semantic profile unproved"
unicode_folding = "normalization and folding profile unproved"
execution_dag = "no demonstrated caller requirement"
mcp_http = "separate deployment and authentication scope"

[excluded]
python_workspace_plugins = "initial compatibility profile"
ssh_transport = "local POSIX transport only"
native_windows_tmux = "WSL is tested as Linux"
private_imsg = "supported tmux CLI and control interfaces only"
