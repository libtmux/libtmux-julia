schema_version = 1
status = "unregistered prerelease"

[support]
julia_development = "1.13.0"
julia_proposed_floor = "1.10"
tmux_proposed_floor = "3.2a"
platforms_proposed = ["Linux x86_64", "macOS arm64", "macOS x86_64"]
# Baseline correctness predates the complete adoption gates. It does not
# establish current revision, timing or broader platform support.
verified_product_cells = []
baseline_revision = "9e3776d07798174a3590a728d28029efcbb52780"
baseline_correctness_cells = [
  "Linux x86_64 / Julia 1.10.0 / tmux 3.2a / 1 thread",
  "Linux x86_64 / Julia 1.13.0 / tmux 3.7c / 4 threads",
  "macOS arm64 / Julia 1.13.0 / tmux 3.7c / 1 thread",
  "macOS x86_64 / Julia 1.13.0 / tmux 3.7c / 1 thread",
]

[required]
packages = "partial: public source installation and baseline runtime verified; final-revision installed task workflows pending; packages are unregistered"
server_selection = "implemented: explicit selectors and opt-in ambient discovery"
entities_links_identity = "partial: captured indexed lookup, physical entities and contextual links verified; final full gates pending"
snapshots_coverage = "partial: full and scoped graphs, relation coverage and daemon-restart rejection verified; final full gates pending"
formats = "partial: typed observations, explicit raw expressions and unverified hints tested current/floor"
options_environment_hooks = "partial: bounded inventories, sparse inheritance, literal framing and encoded custom hooks verified in focused floor/current/upstream probes; final full gates pending; control environment reads explicitly unsupported"
topology_lifecycle = "partial: explicit pane maintenance, topology and owned cleanup verified in focused checks; final full gates and broader platform/version coverage pending"
capture_keys_paste_buffers = "partial: exact bytes, explicit keys, paste and owned buffers pass over subprocess and control in recorded cells; broader platform/version coverage pending"
native_criteria = "partial: schema-typed captured accessors, indexed relationships and native collections verified; compiler, benchmark and independent DX acceptance pending"
wire_adapters = "partial: Julia/JSON plus pinned sibling scalar differentials pass in recorded cells; broader external-consumer coverage pending"
subprocess = "partial: bytes, bounds, cancellation and process retirement pass in recorded cells"
control_batches = "partial: owned lanes, batches/groups, strict capture, graph acquisition, topology, clients, buffers, exact option/hook configuration and environment writes pass in recorded cells; broader platform/version coverage pending"
observation_cursors = "partial: bounded streams and replay pass in recorded cells; reset baseline available; broader platform/version coverage pending"
mcp = "partial: whole-call effects, scoped native discovery, verified pagination and installed source-backed cancellation/restart workflows pass; immutable final-revision installation and full gates pending"
workspace = "partial: config/apply/freeze, owned rollback, installed CLI and stopped output-reader retirement pass in recorded cells; broader platform/version coverage pending"
docs_examples = "partial: Documenter/doctest, contextual and external examples pass in recorded cells; independent human DX gate pending"
benchmarks = "partial: separate environment and six-mode workload added; baseline measurements and performance limits pending"

[deferred]
pushdown = "Q3 admission and differentials required before shipping"
portable_regex = "cross-language semantic profile unproved"
unicode_folding = "normalization and folding profile unproved"
execution_dag = "no demonstrated caller requirement"
mcp_http = "separate deployment and authentication scope"

[excluded]
python_workspace_plugins = "initial compatibility profile"
ssh_transport = "local POSIX transport only"
native_windows_tmux = "WSL is tested as Linux"
private_imsg = "supported tmux CLI and control interfaces only"
