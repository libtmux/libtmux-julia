[acceptance]
scope = "Linux correctness, package checks, shipped examples, installed core/MCP/workspace flows and documentation"
final_revision = "A later revision needs its own affected checks; retained evidence above does not validate the final candidate"
public_github_install = "Run the documented GitHub installation in fresh consumer projects; immutable-export checks alone do not establish it"
shared_documentation = "Verify the shared website build and rendered output; the native Documenter build and API export are separate checks"
separate_followup = ["benchmarks", "exhaustive profiling"]

# Advertised behavior within the selected scope; verification is recorded above.
[required]
packages = "unregistered core, MCP and workspace packages; optional JSON/Tables extensions; normal precompilation and installed launchers"
server_selection = "explicit selectors and opt-in ambient discovery"
entities_links_identity = "captured indexed lookup, physical entities and contextual session/window links"
snapshots_coverage = "full and scoped graphs, relation coverage and daemon-restart rejection"
formats = "typed observations and explicit raw expressions; discovery hints do not prove capability support"
options_environment_hooks = "bounded inventories, sparse inheritance, literal framing and encoded custom hooks; control environment reads are unsupported"
topology_lifecycle = "pane maintenance, topology operations and owned-resource cleanup"
capture_keys_paste_buffers = "exact bytes, explicit keys, paste and owned buffers over subprocess and control"
native_criteria = "schema-typed captured accessors, indexed relationships and native Julia collections"
wire_adapters = "versioned Julia/JSON criteria and pinned sibling scalar interoperability"
subprocess = "bounded bytes, cancellation and process retirement"
control_batches = "owned request/cleanup clients, batches/groups, strict capture, graph acquisition, topology, clients, buffers, named options/hooks and environment writes"
observation_cursors = "bounded streams and retained-history replay with an explicit reset baseline"
mcp = "whole-call effects, scoped native discovery, filtering/projection, changed-observation pagination and cancellation/restart workflows"
workspace = "configuration, planning, apply/freeze, owned rollback, installed CLI and stopped output-reader retirement"
docs_examples = "native manual/API export, doctests, contextual snippets, external examples and installed-launcher checks"

[deferred]
pushdown = "Q3 admission and differentials required before shipping"
portable_regex = "cross-language semantic profile unproved"
unicode_folding = "normalization and folding profile unproved"
execution_dag = "no demonstrated caller requirement"
mcp_http = "separate deployment and authentication scope"

[excluded]
macos = "excluded from CI and current support; historical results remain above"
psmux = "excluded from CI and current support"
python_workspace_plugins = "initial compatibility profile"
ssh_transport = "local POSIX transport only"
native_windows_tmux = "WSL is tested as Linux"
private_imsg = "supported tmux CLI and control interfaces only"
mcp_oversized_graph = "CLI startup and wait setup when a full-graph reply exceeds 8 MiB; scoped discovery does not bypass these stages"
